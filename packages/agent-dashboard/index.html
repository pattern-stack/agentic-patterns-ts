<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agentic Patterns Dashboard</title>
    <script>
      // Apply the resolved theme before first paint to avoid a flash. Mirrors
      // ui/theme-mode.ts resolution exactly (duplicated here because it must
      // run before any module import) — six themes, {family,mode} preference,
      // legacy string migration, live ?theme= override. Default: blue-dark.
      (function () {
        var LIGHT_FOR = { blue: "blue", earth: "earth", chalk: "chalky" };
        var DARK_FOR = { blue: "blue-dark", earth: "earth-dark", chalk: "chalkboard" };
        // Array + indexOf (not an object-literal lookup) so an arbitrary
        // `?theme=` query value can never resolve to an inherited
        // Object.prototype member (e.g. `?theme=toString` truthily "passing"
        // a `{}[q]` check) — mirrors `ui/theme-mode.ts`'s `Set.has` guard.
        var THEME_IDS = ["blue", "blue-dark", "earth", "earth-dark", "chalky", "chalkboard"];
        function prefersDarkOS() {
          try {
            return window.matchMedia("(prefers-color-scheme: dark)").matches;
          } catch (e) {
            return true;
          }
        }
        function resolve(pref) {
          var dark = pref.mode === "system" ? prefersDarkOS() : pref.mode === "dark";
          return dark ? DARK_FOR[pref.family] : LIGHT_FOR[pref.family];
        }
        function migrateLegacy(raw) {
          if (raw === "dark") return { family: "blue", mode: "dark" };
          if (raw === "light") return { family: "blue", mode: "light" };
          if (raw === "system") return { family: "blue", mode: "system" };
          return null;
        }
        var pref = { family: "blue", mode: "dark" };
        try {
          var raw = localStorage.getItem("apdash-theme");
          if (raw) {
            var legacy = migrateLegacy(raw);
            if (legacy) {
              pref = legacy;
            } else {
              var parsed = JSON.parse(raw);
              if (
                parsed &&
                (parsed.family === "blue" || parsed.family === "earth" || parsed.family === "chalk") &&
                (parsed.mode === "system" || parsed.mode === "light" || parsed.mode === "dark")
              ) {
                pref = parsed;
              }
            }
          }
        } catch (e) {
          /* storage unavailable or corrupt — fall through to the default preference */
        }
        var override = null;
        try {
          var q = new URLSearchParams(window.location.search).get("theme");
          if (q && THEME_IDS.indexOf(q) !== -1) override = q;
        } catch (e) {
          /* no-op */
        }
        document.documentElement.setAttribute("data-theme", override || resolve(pref));
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
