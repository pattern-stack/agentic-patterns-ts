name: probe-capabilities

# #390 — scheduled/manual drift check for the model capability map
# (packages/agent-runtime/src/providers/capabilities.ts) against LIVE
# provider behavior. `scripts/probe-capabilities.mjs --check` compares each
# probe outcome to `MODEL_CAPABILITIES` and exits non-zero on disagreement.
#
# Deliberately NOT part of `ci.yml`'s `check` job / the required `check`
# status: external API flakiness (rate limits, transient 5xxs, a provider
# outage) must never block a PR merge. This job is `continue-on-error` and
# runs on its own schedule — drift shows up in the Actions tab, not as a red
# PR check.
#
# Providers whose secret isn't configured in this repo are SKIPPED by the
# script itself (see its own doc comment) — the job still runs and reports
# whichever providers it CAN probe.

on:
  workflow_dispatch: {}
  schedule:
    # Monthly, 1st @ 06:00 UTC — capability drift is slow-moving; a monthly
    # cadence catches provider-side changes without spending API budget daily.
    - cron: "0 6 1 * *"

jobs:
  probe:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Probe capabilities + check drift
        run: bun run scripts/probe-capabilities.mjs --check
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          # OLLAMA_HOST intentionally omitted — a local/VPN-only GPU box isn't
          # reachable from a GitHub-hosted runner; that provider always prints
          # its SKIP row here.
