  - key: "515"
    key_original: gates-5
    title: "runtime: Langfuse exporter targets the real Langfuse JS v4 client — kill the Python-SDK transliteration"
    depends_on: ["491", "507"]
    labels: [runtime, bug]
    description: |
      **Size M · branch `gates/5-langfuse-real-client` · packages: runtime · closes T1 "Langfuse exporter cannot accept a real Langfuse JS client" · BREAKING**

      The injected `LangfuseClient` (`exporters/langfuse.ts:96-114`) is a transliteration of the
      PYTHON SDK (`startSpan`, `as_type`, snake_case `trace_context`/`usage_details`) while
      `package.json:40,45` declares `langfuse@^3` (the JS SDK, a different surface); the file header
      names `@langfuse/langfuse`, which does not exist. Three live bugs beyond the shape mismatch:
      `_traceInputSet`/`_iterUserMessage` never populated (trace never gets an `input`); `_toHexId`
      just strips dashes so non-hex `generateId` runIds produce invalid trace_ids; `flush()` is sync
      while the JS SDK's is async — exit after `flush()` drops the batch.

      **Pinned decisions:** target is DECIDED in-plan (jointly with gates-6, whose OTel context
      plumbing v4 reuses — hence the dependency): langfuse JS v4 (`@langfuse/tracing`), declared
      exactly in peerDeps + header; fall back to v3 `langfuse` ONLY if v4 proves infeasible during
      implementation, recorded in the PR body. This is BREAKING either way: the peerDep retarget
      unmeets anyone on `langfuse@3`, and the injected-interface reshape breaks any out-of-repo
      adapter written against today's shape — CHANGELOG Breaking-changes entry + migration note,
      same treatment as core-1/core-3. The interface must be structurally satisfiable by the real
      client. Populate the trace input from `MessageStartEvent` (delete dead fields if nothing
      usable). Derive `trace_id` as a deterministic 32-hex digest of `runId` (span_id 16-hex). Make
      `flush()` async-aware. Test fixture typed against the real SDK's published types
      (devDependency, typecheck-enforced) so the mock cannot drift again. Depends on gates-1: this
      makes real network calls reachable from event handlers. If the retarget exceeds ~500 lines,
      split (a) id/dead-field/flush correctness from (b) client retarget, remapping the epic item to (b).

      **Acceptance:** `bun run check` green; a fixture typed as the real SDK's client compiles when
      passed to the constructor; peer + header name the same real package; valid 32/16-hex ids from
      an ai-style `generateId`; trace input asserted present; flush no longer drops batches; no dead
      private fields remain; CHANGELOG Breaking-changes entry.

  - key: "516"
    key_original: server-5b
    title: "server: disconnect no longer destroys the run — abortOnDisconnect defaults off"
    depends_on: ["508"]
    labels: [server]
    description: |
      **Size S · branch `srv/s5b-disconnect-detach` · packages: server · disconnect half of T2 "SSE replay" (item recorded on server-5a) — a deliberate reversal of #341's disconnect decision**

      Disconnect kills the work: `onCancel` (`routes/conversations.ts:648-655`) is wired to both
      `stream.onAbort` and the cancel route — a closed tab aborts the turn AND auto-denies every
      pending approval (deliberate per #341; this issue CHANGES that decision, on purpose, in
      isolation — split from server-5a so this flip is revertable under production pressure without
      losing SSE replay).

      **Pinned decisions:** `ServerConfig.conversations?.abortOnDisconnect` default FALSE —
      disconnect detaches the writer, run keeps going (reattach via server-5a's
      `GET /conversations/:id/stream`), `POST …/cancel` is the only abort trigger; `true` preserves
      today's #341 behaviour verbatim (the migration path, not a maybe). Pending inputs are NOT
      denied on plain disconnect (still denied on explicit cancel; still time out). Call out the
      behavioural change loudly in the PR body + its own CHANGELOG **Behaviour changes** entry —
      a turn now outlives its client by default: token burn with nobody watching. Third in the
      conversations.ts track.

      **Acceptance:** `bun run check` green; mid-turn disconnect leaves the run to completion and
      does NOT deny a pending approval (still answerable after reconnect via the stream route);
      `POST …/cancel` still aborts and denies with `conversations-cancel.test.ts` unchanged;
      `abortOnDisconnect: true` reproduces today exactly; CHANGELOG Behaviour-changes entry.

  - key: "517"
    key_original: server-7
    title: "runtime: store-backed AdminService — dashboard stats survive a restart"
    depends_on: ["500", "506"]
    labels: [runtime]
    description: |
      **Size M · branch `srv/s7-admin-store` · packages: runtime · stats half of T2 "Tenancy" ("admin stats are an in-memory ring buffer, lost on restart"; item recorded on server-6b)**

      The only `AdminServiceProtocol` implementation is `InMemoryAdminService` (`admin/service.ts:
