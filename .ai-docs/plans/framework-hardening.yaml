  - key: "519"
    key_original: storage-9
    title: "runtime: PostgresMemoryStore — the second durable backend, proven by the exported conformance kit"
    depends_on: ["509"]
    labels: [runtime, enhancement]
    description: |
      **Size L (endorsed, do not split) · branch `hard/pg-memory-store` · packages: runtime · closes T3 "Postgres store implementations" · spec: ADR-0007 D11, ADR-0009 D13**

      SQLite is the only durable backend; the exported conformance kit (`memory/conformance.ts`,
      602 lines) was written as the SQLite↔Postgres portability contract and has never had a second
      backend to prove it. A CRUD-first split cannot pass its own kit (Tier 1 exercises search).

      **Pinned decisions:** scope is `MemoryStore` ONLY — EventStore/RunStore/EvalStore/
      ConversationStore are OUT OF SCOPE HERE (shared better-sqlite3 ladder, no conformance kit).
      **Gate 0 ruling 2: narrowing STANDS for this issue, but the chain is no longer abandoned** —
      the human wants to DEPLOY on Postgres with SQLite as the zero-config minimum, so the
      `EventStore` chain port is tracked as its own sequenced track (storage-12 → 13 → 14 → 15).
      This issue stays first because MemoryStore is the only store with a protocol AND a conformance
      kit, so it is the only one where "swap the backend" is expressible today — it proves the kit
      before the chain work leans on that pattern. docs-9 records the interim state. Search must
      NOT use `to_tsvector('english', …)` — Porter stemming and `plainto_tsquery` AND-semantics
      both break Tier 2's identical-match-SETS contract (corpus axes 0 and 3/4). Persist the shared
      `tokenize()` output into a `text[]` column with a GIN index, match by array overlap (OR
      semantics), rank by matched-token count then recency — parity is structural, not coincidental.
      Driver injection mirrors `SqliteMemoryStore`: `pg` as OPTIONAL peer dep, pool injected via
      constructor, `loadMemoryStore()` soft-degrade. Own migration ladder (a `schema_version`
      table), never the events ladder. Capabilities `{search: "keyword"}`. CI: conformance runs
      only when `AP_TEST_PG_URL` is set, skips-with-reason otherwise; add a Postgres service to the
      check job (if flaky, land the store env-gated and add the service in a follow-up). The
      storage-8 dependency is the check-chain/ci.yml track — this ci.yml edit lands after
      storage-8's. The Tier 2 non-Latin diacritic `it.todo` (:457) stays a todo.

      **Acceptance:** `bun run check` green both with and without `AP_TEST_PG_URL`;
      `PostgresMemoryStore` passes conformance Tier 1 + Tier 2 against live Postgres; identical
      match sets to both existing backends over `MEMORY_MATCH_CORPUS`; ladder test in the house
      style; `loadMemoryStore()` selection + degrade tested; `docs/store-family.md` and
      `docs/memory/guide.md` updated.

  - key: "520"
    key_original: storage-2
    title: "runtime: ConversationStore step-level write surface — open/append/finalize, tool parts, message status"
    depends_on: ["511", "499", "512"]
    labels: [runtime]
    description: |
      **Size M · branch `dur/2-store-incremental-writes` · packages: runtime · leaf 1 of T2 "Durable execution" (item recorded on storage-1) · takes migration-ladder v8 (after server-3's v7)**

      `ConversationStore` (`conversation/store.ts:78`) can only write a whole message atomically
      (`addMessage`) — no open/append/finalize, which is why persistence can only happen after the
      turn. Storage layer only; no `Conversation` behaviour change yet, so the PR reviews in
      isolation.

      **Pinned decisions (per the ADR):** `status` on `StoredMessage`
      (`streaming`|`complete`|`interrupted`, default `complete` so every existing row and
      third-party implementation reads back unchanged); `appendMessageParts(messageId, parts)` +
      `finalizeMessage(messageId, {status, inputTokens, outputTokens})` (or the ADR's exact
      spelling); `tool_call`/`tool_result` as first-class part types. Implement in
      `InMemoryConversationStore` and `SQLiteConversationStore`; SQLite schema on the EventStore
      ladder (v8). Additions ADDITIVE and structurally optional — a pre-existing third-party store
      must still compile and work at turn-level granularity (the #480 warn-on-ignore posture).
      `position` ordinals carry over. Tool arguments verbatim; tool RESULTS byte-capped with MARKED
      truncation (house rule). Shared describe-factory over both implementations (the
      ConversationStore analogue of `memory/conformance.ts`). Land after server-2 (PR #481 edits
      these exact files).

      **Acceptance:** `bun run check` green; migration-ladder test in the house style; both
      implementations exercised by one shared test body; existing turn-level writes byte-identical;
      `docs/store-family.md` row updated.

  # ── Wave 4 ─────────────────────────────────────────────────────────────────

  - key: "521"
    key_original: runner-5
    title: "runtime+core: RunOptions.timeout — deadlines on model calls, tool calls, and the whole run"
    depends_on: ["504", "514", "485"]
    labels: [runtime, core, enhancement]
    description: |
      **Size M (upper — split model-side/tool-side if diff nears 500 lines) · branch `hr/runner-5-timeouts` · packages: runtime, core · closes T2 "No timeouts on model or tool calls" (`workflows/node-tool.ts:151` documents the absence)**

      Nothing bounds wall-clock time; `maxIterations` bounds count, not duration. Verified: ai@7
      ships `TimeoutConfiguration` (`totalMs`/`stepMs`/`firstChunkMs`/`chunkMs`/`toolMs`) and
      `generateText`/`streamText` accept it — but its `toolMs` never applies to our hand-rolled
      execute-less tool dispatch (gate-chain invariant, `agent-runner.ts:606`; dispatch at :963,
      :1323, :2315).

      **Pinned decisions:** `RunOptions.timeout?: { modelMs?, toolMs?, runMs? }`. `modelMs` → SDK
      `timeout: {totalMs}` on the four generateText calls; map `stepMs`/`firstChunkMs` for
      streamText — native, no hand-rolled races. `toolMs` → `withToolTimeout(promise, ms, toolName)`
      around the three dispatch sites; on expiry produce the SAME structured tool-error the existing
      path feeds back to the model (loop continues), emit `agent.tool.end` with the error, never a
      thrown escape; the timed-out promise is ABANDONED, not killed — document beside `ctx.signal`.
      `runMs` → deadline at the top of each iteration beside the abort guard, reusing runner-2's
      cancelled return path; `finishReason: "timeout"` (`RunResult.finishReason` is `string`), maps
      to `reason: "cancelled"` on `agent.conversation.end` — no new event vocabulary. Core: additive
      `readonly signal?: AbortSignal` on `ToolExecutionContext` (`molecules/toolbox.ts:35`),
      populated in `buildToolCtx` — core declares the slot, host wires the meaning (the
      emit/host/publishArtifact precedent; core version floats). Timeouts implemented as derived
      abort signals composed with `options.abortSignal` via `AbortSignal.any` (why this lands after
      runner-2). Absent `timeout` = today's unbounded behaviour; add the README Known-limitations
      line (section exists — docs-1 is a dependency; docs-9 owns the terminal sweep). Per-subagent
      forwarding is runner-6's, not here.

      **Acceptance:** `bun run check` green; `modelMs` reaches every provider call as an SDK
      `timeout`; a never-resolving toolExecutor under `toolMs` yields a structured tool-error, an
      `agent.tool.end` with the error, and a completing run; `runMs` expiry ends with
      `finishReason: "timeout"` + `conversation.end {reason: "cancelled"}`; `ctx.signal` aborted for
      the timed-out tool and documented cooperative-only; omitting `timeout` leaves every call
      object byte-identical; README Known-limitations line added.

  - key: "522"
    key_original: storage-6
    title: "runtime: model price table as data + costUsd on every AgentRunner run"
    depends_on: ["514"]
    labels: [runtime, enhancement]
    description: |
      **Size M · branch `cost/1-price-table` · packages: runtime, dashboard · anchors T2 "Cost" (leaf: storage-7)**

      No price table exists anywhere; every `costUsd` site is pass-through from the Claude Code
      harness only. The consumers are ALL built — `MessageCompleteEvent.costUsd`
      (`events/types.ts:112`), `RunResult.costUsd`, the SSE `cost_usd` field, OTel
      `gen_ai.usage.cost`, Langfuse `cost_details`, the dashboard's `formatCost` — the only missing
      piece is a number on the `AgentRunner` path.

      **Pinned decisions:** the table is DATA in the `providers/capabilities.ts` shape (Zod schema +
      frozen rows + provenance): new `providers/pricing.ts` with `{provider, match, inputPer1M,
      outputPer1M, cacheReadPer1M?, cacheWritePer1M?, currency, verifiedBy, lastVerified, source}`
      and a pure `estimateCost(modelId, usage)`. Honesty invariant: unknown model ⇒ `undefined`,
      never a guess; every row carries a source URL + lastVerified date from published pricing
      pages. Cache-aware math over `TokenUsageDetails` (`events/types.ts:63-71`); ABSENT MEANS
      UNREPORTED, NEVER ZERO — fall back to the flat input rate. Harness-reported cost ALWAYS wins;
      computed values are LABELLED via `costSource: "harness" | "estimated"` on
      `MessageCompleteEvent` (four coordinated sse-formatter guards + manifest regen + dashboard
      union, the #420 precedent) — an estimate presented as a measurement is exactly what this epic
      removes; if the wire-label change runs long, split it into a trailing PR but withhold
      estimated costs from the wire until the label lands. Gateway runs price by
      `LLMCallEndEvent.gateway.servedModel` when present; lookup precedence: exact id, then longest
      prefix within the provider. Compute once per run at finalization (:794-806), not per
      iteration — hunk verified disjoint from runner-5's guard hunks; rebase on runner-4.

      **Acceptance:** `bun run check` green incl. the dashboard SSE drift test and
      `check:docs-events`; unit tests for lookup precedence, cache-aware math, unknown-model
      undefined, harness-wins, gateway servedModel pricing; module-load self-validation that every
      row parses; events reference regenerated via `bun run docs:events`.

  - key: "523"
    key_original: server-6b
    title: "server: tenant comes from the verified principal, never from the request body"
    depends_on: ["498", "500", "516"]
    labels: [server, audit]
    description: |
      **Size M · branch `srv/s6b-tenant-enforcement` · packages: server · closes T2 "Tenancy" (with server-6a + server-7 as its storage/stats halves)**

      `POST /conversations` reads `body.scope`, validates it against the registration's
      `SessionScope` schema, and binds it verbatim (`routes/conversations.ts:99-192`) — the schema
      proves the value is well-shaped, never that the caller is ENTITLED to it; a caller can assert
      `{organizationId: "someone-else"}` and run as that org. Every `/admin` read is global
      (`routes/runs.ts:26-44`).

      **Pinned decisions:** `ServerConfig.tenancy?: { tenantOf(principal); deriveScope?(principal,
      callerScope) }`. When configured: the derived scope wins for any key the embedder claims —
      caller-supplied server-asserted keys are a named 403, never a silent overwrite (ADR-0004 §5's
      exact rejected failure); tenant stamped onto run/event/conversation rows via server-6a's
      column; `GET /admin/runs`, `GET /admin/events/recent`, `GET /admin/conversations`,
      `GET /conversations` filter by `tenantOf(principal)`. No `tenancy` configured ⇒ byte-identical.
      Tenant derives from the principal ONLY — no header or body field can set it. Scope stays fixed
      at conversation creation (ADR-0004 Decision 2 untouched). Resume re-derives the tenant and
      403s on disagreement with the persisted binding. Does NOT touch MemoryStore scope partitioning
      (author-declared, bound at instantiate per ADR-0007 D3). Fourth in the conversations.ts track
      (after server-5b). Rider: if server-4 has landed, extend tenant filtering to
      `GET /admin/pending-input` (server-4 carries the mirror-image rider — whichever lands second
      adds the one-line filter).

      **Acceptance:** `bun run check` green; with tenancy configured, asserting another tenant's
      scope key gets 403 and no conversation is created; principal A's rows absent from every admin
      read made as principal B and present for A; cross-tenant resume 403s; with tenancy unset, the
      full existing suite passes unchanged; `docs/server-auth.md` gains the tenancy section.

  - key: "524"
    key_original: server-4
    title: "server+cli: wire the durable pending-input store and surface orphaned approvals"
    depends_on: ["512", "498", "517"]
    labels: [server]
    description: |
      **Size S · branch `srv/s4-pending-input-routes` · packages: server, cli · delivery half of T2 "Durable pending-input registry" (item recorded on server-3) — DoD #3 gating**

      server-3 makes the registry capable of durability; nothing yet USES it. `ap playground`
      constructs a bare `new PendingInputRegistry()` (`playground.ts:99`), and the only route
      touching pending state — `POST /conversations/:id/input` (`routes/conversations.ts:~856`) —
      returns a flat 404 for every miss, so "already answered", "never existed" and "restart dropped
      it" are one indistinguishable response. Dependency graph deliberately SHALLOW (critic
      finding): needs server-3 (the store), server-1 (the verify seam its `/admin` route mounts
      behind), and server-7 (last in the playground.ts file track); it does NOT wait on the
      tenancy/SSE chains — its conversations.ts hunk (~:856) is disjoint from server-5/6b's, rebase
      handles it.

      **Pinned decisions:** CLI: construct the registry with the SQLite `PendingInputStore` on the
      same persistence path as the event/run stores, gated by `AP_PERSISTENCE`, `sweepOrphans()`
      once at boot. Server: `GET /admin/pending-input` (live + orphaned, behind the `notConfigured`
      503 grammar, behind server-1's verify seam like every `/admin` route); `POST …/input`
      distinguishes 404 (unknown) from 410 (orphaned by restart — terminal-denied, with reason). The
      server takes no new required config — it reads through the registry it is handed
      (`config.ts:253`). Rider: if server-6b has landed, add its `tenantId` filter to
      `GET /admin/pending-input`; otherwise server-6b's rider adds it. Last in both the
      conversations.ts and playground.ts tracks.

      **Acceptance:** `bun run check` green; with a store, an unanswered request written by one
      instance is listed orphaned by a fresh instance and answering it returns 410 with a reason;
      without a store, `GET /admin/pending-input` 503s in the existing grammar and `POST …/input`
      behaves byte-identically (404/501 paths unchanged); the existing approval round-trip test
      passes untouched.

  - key: "525"
    key_original: storage-3
    title: "runtime: step-level turn persistence — request row up front, flush on tool result, real toolCalls"
    depends_on: ["520"]
    labels: [runtime]
    description: |
      **Size M · branch `dur/3-step-level-persistence` · packages: runtime · leaf 2 of T2 "Durable execution" (item recorded on storage-1) — the PR that clears the VoltAgent bar**

      Rewire `Conversation` onto the storage-2 surface: persist the `request` message BEFORE the
      runner is invoked (today `send()` persists at `conversation.ts:196` and `stream()` at :352,
      both after the turn); open the response with `status: "streaming"`; flush on every
      `agent.tool.end` in the stream loop (:305-352) — the `flushOnToolResult` trigger — appending
      `tool_call`/`tool_result` parts; coalesce chunks, flush text on the same boundary, never per
      chunk; finalize with usage + `status: "complete"`. Also close the tool-call hole:
      `Exchange.toolCalls` is a hardcoded `[]` on both paths (:180, :337) — populate from observed
      `agent.tool.start`/`agent.tool.end` events so `_toMessageHistory()` (:441) rebuilds a faithful
      history.

      **Pinned decisions:** `send()` has no event stream — it gets request-then-response two-phase
      persistence and CANNOT flush per step; state that in the docblock, don't imply parity. The D5
      rule at :355 (errored zero-output turn not recorded) must survive: with the request row
      already written, that turn is FINALIZED as `interrupted`, never a dangling unpaired request.
      Default per ADR D5; the opt-out path produces byte-identical writes to today. Write
      amplification (a 10-tool turn: 2 → ~12 writes) bounded by coalescing.

      **Acceptance:** `bun run check` green; a mid-stream teardown test (runner throws after a tool
      result) asserts the store holds the request, the tool parts, the partial text and
      `status: "interrupted"`; a clean turn in opt-out mode persists byte-identically;
      `Exchange.toolCalls` asserted non-empty for a tool-using turn on both paths where applicable;
      CHANGELOG entry.

  # ── Wave 5 ─────────────────────────────────────────────────────────────────

  - key: "526"
    key_original: runner-6
    title: "runtime: forward per-step model params + timeout through the workflow seam (AgentStep / delegateTo / Sequential)"
    depends_on: ["514", "521"]
    labels: [runtime, workflows, enhancement]
    description: |
      **Size S · branch `hr/runner-6-step-seam-run-controls` · packages: runtime · completion half of T2 "model-param passthrough" (item recorded on runner-4) — the epic item's stated blocker is "per-step effort tiering in the consuming product", which runner-4's run-level bag alone cannot deliver; this seam is the item's actual close condition, not scope creep**

      runner-4/5 add `RunOptions.modelParams` and `RunOptions.timeout`, but the workflow layer
      builds `RunOptions` itself: `AgentStepSpec` (`agent-step.ts:45-84`) forwards only
      `model`/`runner`/`maxIterations`; `SubagentSpec.runOptions` (`node-tool.ts:151-158`) carries
      the standing "per-subagent timeout is NOT forwardable today" comment;
      `sequential-agents.ts:674` spreads `maxIterations` only. The product's stated need —
      a coordinator assigning `high` to one subagent and `minimal` to another — requires the seam.

      **Pinned decisions:** add optional `modelParams` + `timeout` to `AgentStepSpec` and
      `SubagentSpec.runOptions`; forward at the three build sites with the existing
      conditional-spread style; delete the stale `node-tool.ts:151` note and the
      `sequential-agents.ts:46/117` knob-list prose. Step-spec value wins over the caller's
      run-level value (same precedence as the `model` override); last writer wins, no deep-merge —
      stated in the docstring. Extend the build-time knob-rejection list
      (`sequential-agents.ts:477`) so the new knobs are rejected on non-AgentStep nodes rather than
      silently ignored. Deliberately split from runner-4/5 so those stay runner-local.

      **Acceptance:** `bun run check` green; a `delegateTo` subagent declared with
      `runOptions: {modelParams: {reasoningEffort: "minimal"}}` observed calling the model with that
      setting while its coordinator uses another; a step-level `timeout` reaches the inner runner's
      `RunOptions`; specs without the new fields produce byte-identical `RunOptions`; the knob guard
      rejects the new knobs on non-agent nodes.

  - key: "527"
    key_original: storage-4
    title: "runtime: interrupted-turn recovery — rehydrate partial turns with their tool results, never re-execute"
    depends_on: ["525", "499", "495"]
    labels: [runtime]
    description: |
      **Size M · branch `dur/4-interrupted-turn-recovery` · packages: runtime · leaf 3 of T2 "Durable execution" (item recorded on storage-1) — the read half**

      `exchangesFromMessages` (`conversation/rehydrate.ts`, landing with #480/server-2) deliberately
      DROPS a `request` with no following `response` — exactly the crash-mid-turn record — and
      rebuilds `toolCalls: []` because tool parts were never stored. After storage-2/3 both premises
      are false. Teach it: request + `interrupted` response rebuilds as an Exchange whose assistant
      text is the partial text with an explicit marker (preserving user/assistant alternation);
      persisted tool parts rebuild into `Exchange.toolCalls` and `_toMessageHistory()` so the
      resumed prompt shows the model the tool ALREADY RAN; a boot-time sweep flips rows still
      `streaming` to `interrupted` — the ConversationStore mirror of `sweepRunning()`, wired at
      storage-5's `load*` seam, not a second one.

      **Pinned decisions:** recovery NEVER re-executes a committed tool call — restored parts are
      history, not a replay queue. No automatic continuation in v1: the host gets a conversation
      whose last turn is visibly incomplete and decides. `state_delta` frames keep their exclusion
      from replayed prompt text. Hard external dependency: `rehydrate.ts` does not exist on main
      until server-2 lands.

      **Acceptance:** `bun run check` green; a crash→resume test (write via storage-3, kill
      mid-stream, rebuild through `exchangesFromMessages`, assert the tool result is in the rebuilt
      history and NOT re-dispatched next turn); alternation asserted (never two consecutive user
      turns); boot-sweep test for streaming→interrupted; the ADR's recovery section updated to what
      shipped.

  - key: "528"
    key_original: storage-7
    title: "runtime: run budgets that actually halt — RunOptions.budget and a top-of-iteration spend seam"
    depends_on: ["522", "521", "525", "485"]
    labels: [runtime, enhancement]
    description: |
      **Size M · branch `cost/2-budget-halt` · packages: runtime · budgets half of T2 "Cost" (item recorded on storage-6)**

      Today the only run-terminating limit is `maxIterations`. A new seam IS required, confirmed by
      reading both existing paths: the gate chain is driven from TOOL intents only (no gate can stop
      token spend) and exporters are non-blocking by design. The one place the runner already stops
      cleanly mid-run is the top-of-iteration abort guard (`agent-runner.ts:715-727` run,
      :1815-1830 stream, :1385 runStructured) — the budget check belongs beside it.

      **Pinned decisions:** `RunOptions.budget?: { maxUsd?, maxTokens? }`, checked pre-iteration
      against the run's accumulators (USD via storage-6's `estimateCost`). Termination mirrors
      `maxIterations`, not an exception: `finishReason: "budget_exceeded"` (FinishReason is
      `string` — no union or wire-vocabulary change), partial content preserved. Enforcement is
      PRE-CALL only — overshoot of at most one model call; state it in the docstring and the README
      Known-limitations line (section exists — docs-1 is a dependency; docs-9 owns the terminal
      sweep). `maxUsd` against an unpriced model CANNOT be enforced: throw at run start, never run
      silently uncapped. `maxTokens` always enforceable. Per-run only — cross-run/per-tenant caps
      need a store and belong with tenancy; say so, don't fake it. Thread through
      `Conversation.send()`/`stream()` options (lands after storage-3's rewiring of the same file);
      server wiring out of scope. The `stream()` exit must reuse the existing post-loop return
      (locked D1 from #341), never a second half-emitted terminal shape.

      **Acceptance:** `bun run check` green; a token budget halts before the next model call on all
      three paths with `finishReason: "budget_exceeded"` and partial content intact; `maxUsd`
      against an unpriced model throws at run start; no budget = byte-identical behaviour;
      `Conversation` passthrough covered; README Known-limitations line added.

