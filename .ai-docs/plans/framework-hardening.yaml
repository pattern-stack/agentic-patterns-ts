  - key: "491"
    key_original: gates-1
    title: "runtime: exporters must not take the agent loop down — fail-safe dispatch + real ConsoleExporter default"
    depends_on: []
    labels: [runtime, bug]
    description: |
      **Size S · branch `gates/1-exporter-failsafe` · packages: runtime · closes T0 "ConsoleExporter defaults to a no-op logger" + T1 "BaseExporter.handleEvent dispatches with no try/catch"**

      1. `exporters/base.ts:58-77` awaits `handler.call(this, event)` bare — a throw inside any
      `_on*` handler propagates out of `EventBus.publish` into the agent loop.
      `HttpEventExporter` already gets this right (`http.ts:29,49,87-88`); make it the rule.
      2. `exporters/console.ts:50-57,75` — `new ConsoleExporter()` installs `noopLogger()` and
      prints nothing.

      **Pinned decisions:** try/catch in `base.ts` only (one dispatch site, every exporter inherits);
      failures route to a settable `onExporterError?: (err, event) => void` property (not a
      constructor arg — `BaseExporter` has no options today); default handler logs `console.error`
      with exporter name + event type and never rethrows. ConsoleExporter default logger binds to
      **STDERR** (`console.error` / `process.stderr.write`), NOT stdout: a process that speaks a
      protocol over stdout (an MCP stdio server, `ap` piping JSON) with a bare
      `new ConsoleExporter()` must not have its wire format corrupted by a default — state that
      hazard in the docblock; `{logger: console}` remains the explicit stdout opt-in and
      `noopLogger` stays exported as the explicit silence opt-out. Do NOT touch the README fences —
      docs-3 owns those (and documents the stderr default).

      **Acceptance:** `bun run check` green; a throwing `_on*` handler leaves `bus.publish()`
      resolved and the sibling exporter still called; `new ConsoleExporter()` writes to an injected
      stderr-bound double and NOTHING reaches stdout by default; CHANGELOG flags the default-logger
      behaviour change including the stderr choice.

  - key: "492"
    key_original: gates-3
    title: "runtime: stateful gates go production-shaped — keyed RateLimitGate buckets + bounded AuditGate"
    depends_on: []
    labels: [runtime, bug]
    description: |
      **Size M · branch `gates/3-stateful-gates` · packages: runtime · closes T1 "AuditGate accumulates unbounded arrays" + T2 "RateLimitGate is a single in-process bucket"**

      1. `gates/rate-limit.ts:13-46` — one `_tokens`/`_lastUpdate` pair per instance; every tenant/
      run/agent shares it. Add `keyBy?: (event: ToolCallIntent) => string` over a `Map<string, Bucket>`.
      2. `gates/audit.ts:33,40` — `entries` and `decisions` grow forever on a long-lived server.

      **Pinned decisions:** `keyBy` default = constant `"global"` (today's behaviour exactly); keyed
      buckets get idle eviction (`maxKeys` default 10k) — keying without eviction just moves the
      leak; declare (do NOT implement) an async `RateLimitBucketStore` seam; state the N-replica
      multiplication caveat in the docblock. AuditGate: `maxEntries` (default 1000) as FIFO drops
      mutating the arrays IN PLACE (preserve array identity — both are readonly bindings held by
      consumers), optional `sink?: (entry) => void` invoked before the drop, `droppedCount` counter
      so loss is observable. Real per-tenant keying needs a trustworthy tenant id (server-6b) — this
      ships the seam, not the trust. Rider: if `docs/gates.md` exists at land time (docs-4), update
      its AuditGate/RateLimit limitation lines to the bounded/keyed behaviour; if not, docs-4
      (landing later) documents the shipped behaviour itself — either order stays truthful.

      **Acceptance:** `bun run check` green; per-key isolation, shared-key exhaustion, refill,
      bucket eviction at `maxKeys`, audit FIFO cap with stable identity, sink invocation and
      `droppedCount` all tested; CHANGELOG notes the new 1000-entry default cap; gates.md rider
      applied when applicable.

