      intent) => boolean | Promise<boolean>; reason?: string }`, evaluated after the name checks.

      **Pinned decisions:** no rules ⇒ byte-identical behaviour. `tool` omitted = applies to every
      tool. A throwing predicate fails CLOSED (block, reason names the rule) — the deliberate
      opposite of gates-1's exporter fail-open rule; state that in the docblock so nobody
      "harmonises" them. Async predicates allowed; raw arguments record, no Zod coupling. Export
      `SafetyRule` from the gates barrel. New per-gate test file `gates/__tests__/safety.test.ts`
      (gates-3 owns the shared gates.test.ts). Rider: one-line `docs/gates.md` limitations update
      (page exists — docs-4 is now a dependency, so the rider is always satisfiable).

      **Acceptance:** `bun run check` green; tests for name-only back-compat, arg-match block,
      non-matching-tool passthrough, async predicate, throwing predicate ⇒ block, and reason
