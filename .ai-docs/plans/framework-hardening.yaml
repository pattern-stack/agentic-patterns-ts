      **Pinned decisions:** `const runId = options?.runId ?? generateId();` — one line, matching
      `run()`. Mint-only-when-absent, no new option, byte-identical when `runId` is omitted.
      `traceId` handling is already correct — leave it.

      **Acceptance:** `bun run check` green; `stream({runId: "host-seeded"})` yields
