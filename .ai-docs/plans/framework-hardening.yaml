    description: |
      **Size M · branch `docs/482-readme-workflow-examples` · packages: none (docs) · closes T0 "README documents deleted classes" · spec: `.ai-docs/patternstack/DESIGN.md` §6.6+§6.7, docs-management SKILL truth gate 3**

