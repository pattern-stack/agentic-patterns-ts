  - key: "511"
    key_original: storage-1
    title: "docs(adr): durable execution — turn journal, step-level persistence, interrupted-turn recovery"
    depends_on: ["485"]
    labels: [documentation]
    description: |
      **Size S · branch `dur/1-adr-durable-execution` · packages: none (docs) · anchors T2 "Durable execution" (leaves: storage-2/3/4)**

      Durable execution is a sub-epic, not one issue. Today `Conversation` persists only after the
      turn completes (`conversation.ts:196` send, `:352` stream) and `Exchange.toolCalls` is a
      hardcoded `[]` on BOTH paths (`:180`, `:337`) — a crash mid-turn loses the user's message, the
      partial answer, and every tool call. This issue writes the ADR only — no code. Take the next
      free ADR number (0010 is taken). Depends on docs-1 because D4's README line goes into the
      "Known limitations" section docs-1 creates — the section must exist to write into.

      **Pinned decisions to make (decided in the ADR, not left open):** D1 journal granularity —
      request persisted BEFORE the runner runs; response flushed at step boundaries with tool result
      as the trigger (VoltAgent's `flushOnToolResult` is the bar); chunks coalesced. D2 write shape —
      recommend append-into-open-message (a message-per-step model breaks #480's request→response
      pairing in `exchangesFromMessages`). D3 recovery — restored parts are HISTORY, never
      re-executed; no automatic continuation in v1. D4 out of scope — workflow/step checkpointing
      for layer-10 patterns; add the README Known-limitations line (docs-9 owns the terminal sweep).
      D5 default posture — pin one (recommend on-by-default when a store is wired, with opt-out).
      D6 boundary with #480's `rehydrate.ts`, which currently DROPS unpaired requests.
      Follow the docs-management SKILL frontmatter contract + sidebar placement.

      **Acceptance:** `bun run check` green; ADR merged with D1-D6 decided; `docs/store-family.md`
      notes the durability posture per store; README Known-limitations line added; link check +
      drift checks pass.

  - key: "512"
    key_original: server-3
    title: "runtime: PendingInputStore — pending approvals survive a process restart"
    depends_on: ["500"]
    labels: [runtime]
    description: |
      **Size M · branch `srv/s3-pending-input-store` · packages: runtime · closes T2 "Durable pending-input registry" (delivery half is server-4) · takes migration-ladder v7 (after server-6a's v6)**

      `PendingInputRegistry` is a plain `Map` of unsettled promises
      (`interaction/pending-input-registry.ts:44-49`); its own docblock (:13) states "holds no
      durable session state." Every human-in-the-loop round-trip routes through it; a restart drops
      every pending approval with no row, no audit event, and an indistinguishable 404 for the
      answering client.

      **Pinned decisions:** new `interaction/pending-input-store.ts` — `PendingInputStore` protocol
      (`put`/`resolve`/`get`/`list`/`sweepOrphans`, all async) with `InMemoryPendingInputStore`
      beside it plus a SQLite backend on the shared `EventStore` file (v7 rung, additive, same WAL
      pragmas). Registry gains an optional `store`: `create()` writes the row BEFORE returning the
      promise (preserving the synchronous-registration guarantee); `resolve()` records and clears;
      `denyAll()` records the reason; `sweepOrphans()` marks prior-process rows `orphaned` at boot.
      A Promise cannot survive a restart — durability means the RECORD survives and the orphan is
      visible and auditable, NOT that the blocked run resumes (that is durable execution); say so in
      the docblock (docs-9 carries the distinction into README Known limitations). Fail closed:
      orphaned = terminal-denied, matching `TIMED_OUT_DENY`. No store configured ⇒ byte-identical.
      Registry method signatures stay source-compatible.

      **Acceptance:** `bun run check` green; both backends round-trip put/resolve/list; a row
      written then a FRESH registry over the same store lists it orphaned and a later resolve
      reports terminal-denied; existing registry tests (duplicate-correlationId chaining, timeout
      DENY, denyAll) pass with no store AND each backend; migration-ladder test in the house style;
      `docs/store-family.md` gains the PendingInputStore row.

