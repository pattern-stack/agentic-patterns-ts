  - key: "509"
    key_original: storage-8
    title: "ci: gate the deterministic eval families on every PR — and fix the two portability cases that are red today"
    depends_on: ["488", "493"]
    labels: [testing]
    description: |
      **Size M · branch `hard/eval-gate-ci` · packages: none (evals + CI) · closes T3 "Gate the eval harness in CI"**

      The harness is red on main today, verified: `bun x tsx evals/memory-behavior/run.mts --dry`
      exits 1 — `memory-portability` errors on `port-stemming-prefer` and `port-substring-am`
      ("both legs empty"). Root cause: those cases query the corpus's NEGATIVE axes (word boundary,
      substring — `conformance.ts:71-84`), so a mutual miss is the CORRECT portable answer, but the
      both-empty guard (`run.mts:730-740`) turns correct agreement into an ERROR. The README's 7/7
      PASS run log (:259) is stale.

      **Pinned decisions:** teach the parity scorer a declared mutual-miss expectation
      (`expected: { parity: true, mutualMiss: true }`) so a negative axis is asserted deliberately;
      keep the vacuous-agreement guard for every other case; do NOT loosen a tier to go green (the
      README's own obligation). Then gate: root script `"eval:memory": "tsx
      evals/memory-behavior/run.mts --dry"`, a ci.yml step in the check job after Build, and the
      same script in the root `check`. Only DETERMINISTIC families gate PRs — live families need
      credentials that fork PRs cannot have; keep them behind `workflow_dispatch` at most.
      `just eval-memory` stays the human entry point. If the fix belongs in the shared
      `MEMORY_MATCH_CORPUS` rather than the scorer, split that runtime change out. Confirm hermetic
      run under a fresh CI HOME. The docs-6/storage-10a dependencies are the check-chain/ci.yml
      track: docs-6 edits the SAME `"check"` line (guaranteed textual conflict) and storage-10a the
      publish job; storage-9 lands its ci.yml edit after this one.

      **Acceptance:** `bun run check` green; `bun run eval:memory` exits 0 on a clean tree; the step
      runs in ci.yml and in the root `check`; the two cases assert mutual-miss explicitly with the
      family kept at tier hard; README family section + run log corrected; no leftover temp dbs.

