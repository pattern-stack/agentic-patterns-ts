  - key: "530"
    key_original: docs-10
    title: "docs: generated preset prompt reference — show what a preset actually injects"
    depends_on: ["486"]
    labels: [documentation, runtime]
    description: |
      **Size S · branch `docs/10-preset-reference` · packages: runtime, docs-site · closes Gate 0 ruling 1's follow-on (preset legibility) · wave 2**

      `analystRole()` returns a frozen `Role`; nothing at the import site says it injects seven lines
      of prose plus a whole Boundaries section inherited from `EVIDENCE_QUALITY`. Rendered live
      against the built package, `analystRole({domain:"deal risk"})` emits constraints the caller
      never sees — "Score 0 for dimensions with no evidence, not 'unknown'", "Distinguish between
      'not mentioned' (gap) and 'mentioned negatively' (risk)" — and two escalate-when triggers.
      That invisibility, not the preset's size, is why a preset reads as "too simple to import".

      **Pinned decisions:** generated page, same contract as `docs/reference/events.md` — a
      generator under `tools/` renders every preset via `Agent.renderSections()`, writes
      `docs/reference/presets.md`, and a `check:docs-presets` step fails the build on drift. Render
      the `[role]` / `[instance]` attribution `renderSections()` already returns — that attribution
      is the differentiator no competitor ships, and this is the first page that makes it visible.
      Cover the four roles (`coordinatorRole`, `orchestratorRole`, `analystRole`, `retrievalRole`)
      and name the judgment + responsibility constants each one wires. Demo agents are excluded
      (they move to `/demo` in core-3). Prose is generated, never hand-authored — a preset whose
      prompt changes updates the page or fails CI.

      **Acceptance:** `bun run check` green incl. the new drift step; `docs/reference/presets.md`
      generated, sidebar-placed per the docs-management skill, and byte-identical on a second run;
      editing a preset's persona without regenerating FAILS the check; page renders the role/instance
      tags; frontmatter contract satisfied.

  - key: "531"
    key_original: storage-12
    title: "runtime: SQL dialect seam under the EventStore chain — widen storage/load.ts to a driver contract"
    depends_on: ["519"]
    labels: [runtime, enhancement]
    description: |
      **Size L (justified — this is the seam, splitting it ships half a contract) · branch `pg/12-dialect-seam` · packages: runtime · leaf 1 of the Postgres deployment track · wave 5**

      The durable stores are ONE inheritance chain — `SQLiteConversationStore extends EvalStore
      extends RunStore extends EventStore` (`storage/{event,run,eval,conversation}-store.ts`,
      ~2,250 lines, 44 prepared statements) — so "conversations on Postgres" cannot be picked off
      alone. `storage/load.ts` already chooses `bun:sqlite` vs `better-sqlite3` behind a named-param
      adapter shim; that shim is the seam to widen, not a new abstraction to invent.

      **Pinned decisions:** no ORM, no query builder — a narrow `SqlDriver` contract
      (prepare/run/all/get/transaction/close) plus a `Dialect` for the handful of constructs that
      actually differ (placeholder style, upsert, `RETURNING`, autoincrement, JSON column type,
      `PRAGMA user_version` vs a `schema_version` table). SQLite stays the default and the zero-config
      path — the human's stated minimum. This issue is REFACTOR ONLY: no Postgres implementation, no
      behaviour change, every existing store test green against the seam. Prepared statements bound
      in constructors are the main obstacle — decide and document whether they become lazily-prepared
      per-dialect or dialect-templated at construction.

      **Acceptance:** `bun run check` green; every existing storage/exporter/eval test passes
      unchanged against the seam; no new dependency; `docs/store-family.md` documents the driver
      contract and states that SQLite remains the default.

  - key: "532"
    key_original: storage-13
    title: "runtime: PostgresEventStore + PostgresRunStore behind the dialect seam"
    depends_on: ["531"]
    labels: [runtime, enhancement]
    description: |
      **Size L (justified — RunStore extends EventStore; separating them ships an unusable half) · branch `pg/13-event-run` · packages: runtime · leaf 2 · wave 5**

      Ports the base of the chain: `EventStore` (562 lines, 9 statements — append-only event log,
      retention/`maxRows` pruning, WAL) and `RunStore` (475 lines, 10 statements — one row per run,
      first-terminal-wins, `sweepRunning`). Together these are the audit trail and every admin stat.

      **Pinned decisions:** `pg` stays an OPTIONAL peer dep with soft-degrade, mirroring
      `storage-9`'s `PostgresMemoryStore`. The migration ladder becomes a `schema_version` table on
      the Postgres side — the SQLite `PRAGMA user_version` ladder is untouched, and the two must
      reach the same schema version for the same content (assert it in a test). Retention pruning
      must not table-scan: index it. `sweepRunning` gains the server boot call the epic's corrected
      item asks for.

      **Acceptance:** `bun run check` green with and without `AP_TEST_PG_URL`; a shared store test
      suite runs green against BOTH backends; ladder-parity test; retention/pruning verified on
      Postgres; admin stats identical across backends for the same event sequence.

  - key: "533"
    key_original: storage-14
    title: "runtime: PostgresEvalStore + PostgresConversationStore — the rest of the chain"
    depends_on: ["532"]
    labels: [runtime, enhancement]
    description: |
      **Size L (justified — the two remaining chain links) · branch `pg/14-eval-conversation` · packages: runtime · leaf 3 · wave 6**

      Ports the top of the chain: `EvalStore` (837 lines, 15 statements — sets/cases/runs/results,
      splits, `compareEvalRuns`, `caseResultHistory`, `splitAggregates`) and
      `SQLiteConversationStore` (376 lines, 10 statements), renamed to reflect that it is now one
      backend among two. With this leaf, a deployment can run conversations, runs, events, evals and
      memory on Postgres — which is the actual goal of the track.

      **Pinned decisions:** `compareEvalRuns`'s per-case aligned union is the query most likely to
      diverge between dialects — pin it with a fixture asserting identical bucket counts on both
      backends. Coordinate with storage-2's step-level write surface: if storage-2 has landed, the
      open/append/finalize path ports here too.

      **Acceptance:** `bun run check` green both configurations; shared suite green on both backends;
      `compareEvalRuns` bucket-parity fixture; conversation resume (server-2) verified against
      Postgres end to end.

  - key: "534"
    key_original: storage-15
    title: "ci: dual-backend gate — docker-compose Postgres running the full store suite on every PR"
    depends_on: ["533"]
    labels: [runtime, documentation]
    description: |
      **Size M · branch `pg/15-dual-backend-ci` · packages: runtime, docs-site · leaf 4, closes the Postgres deployment track · wave 6**

      Without a gate the second backend rots — the Langfuse exporter is the cautionary case in this
      very plan: real mapping logic, never once run against the real SDK, broken for months.

      **Pinned decisions:** a Postgres service in the `check` job (or a sibling job if `check`'s
      wall-clock becomes the constraint — say which, do not leave it implicit), plus a
      `docker-compose.yml` giving the same thing locally so a contributor can reproduce the gate
      without CI. `AP_TEST_PG_URL` skip-with-reason stays for contributors without Docker, but CI
      must NOT be allowed to skip — a green check with silently-skipped Postgres tests is worse than
      no gate. Ship the deployment guide here: SQLite is the default and the zero-config path,
      Postgres is the deployment path, this is how you point at one.

      **Acceptance:** `bun run check` green; CI demonstrably FAILS if a Postgres store regresses
      (prove it with a deliberately broken commit in the PR description); local docker-compose path
      documented and verified; `docs/store-family.md` + a deployment page updated; docs-9's Postgres
      Known-limitations bullet updated or removed to match what actually shipped.
