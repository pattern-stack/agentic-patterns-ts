  - key: "498"
    key_original: server-1
    title: "server: optional verify(req) auth seam mounted before every route + token-gated hooks ingest"
    depends_on: []
    labels: [server, audit]
    description: |
      **Size M · branch `srv/s1-verify-hook` · packages: server · closes T2 "Auth" — the follow-up ADR-0004 §Alternatives names by hand (`0004:129-131`)**

      `createServer` mounts every route unguarded (`app.ts:31-72`): `/admin/*`, `/conversations/*`,
      `/events`, `/hooks/*`, `/eval/*`. Sharpest edge: `POST /hooks/:eventType`
      (`routes/hooks.ts:30-72`) publishes caller-controlled JSON onto the shared bus and derives
      canonical tool events from it — an unauthenticated caller can forge the audit trail. `POST
      /events` already gates on `AP_INGEST_TOKEN` (`routes/events.ts:22-26`); hooks never got it.

      **Pinned decisions:** one optional seam + a written stance, NOT a bundled login/JWT scheme.
      New `middleware/auth.ts` with `verifyMiddleware(verify, opts)`;
      `ServerConfig.verify?: (c) => Promise<Principal | undefined>` is the single trust boundary,
      mounted `app.use("*", …)` after cors and BEFORE every `app.route(...)`; principal parked on
      Hono `Variables` (`c.set("principal", …)`) — the slot server-6b reads. No `verify` configured
      ⇒ byte-identical to today. Exempt paths default `["/health"]`. Hooks token: `AP_HOOKS_TOKEN`
      verbatim after the events precedent, enforced only when configured (`hooks/emit.mjs` is copied
      into user projects and will not retroactively update); un-tokened path logs ONE startup warning
      naming the forgery risk. **CORS default FLIPS** (Gate 0 ruling 3 — plan's "document it" position
      OVERRIDDEN): `middleware/cors.ts:16` currently defaults `origin: config?.origin ?? "*"`. With
      no auth that means any page a user visits can drive this server and read the responses; the
      docstring's "callers should pin origin for production" is the same wrong-default shape as the
      empty gate chain. New default is the loopback set (`http://localhost:*`, `http://127.0.0.1:*`)
      for the dashboard-dev case it was written for; `"*"` remains available but only when set
      EXPLICITLY, and `origin: "*"` together with `credentials: true` hard-errors at construction
      (invalid per the CORS spec and currently silently accepted).

      **Acceptance:** `bun run check` green; with no `verify` every existing server test passes
      unchanged; with a rejecting `verify`, 401 on `/admin/dashboard`, `POST /conversations`,
      `POST /events`, `POST /hooks/SessionStart` and 200 on `/health`; handlers read
      `c.get("principal")`; with `AP_HOOKS_TOKEN` set, hooks 401 without the header and no event
      reaches the bus on the 401 path; new `docs/server-auth.md` per the docs-management SKILL, with
      ADR-0004's deferral note amended to point at it.

  - key: "499"
    key_original: server-2
    title: "server: land conversation resume from the store (#480) — rebase PR #481, re-verify, document the resume contract"
    depends_on: []
    labels: [server, runtime]
    description: |
      **Size M (budget L review) · branch `fix/480-conversation-continuity` (PR #481, already open) · packages: server, runtime · closes T2 "Conversation resume — #480"**

      `app.ts:28` holds conversations in a process-local `Map` with route-minted ids while the store
      mints a second durable id — the two id spaces were never reconciled, so no conversation can be
      continued after a restart or from the list view. `Conversation` already accepts
      `history?: Exchange[]` (`conversation.ts:100-114`) and nothing ever passes it.

      **This is a rebase, not an implementation.** PR #481 (OPEN + MERGEABLE) already ships: one
      conversation identity, a persisted `binding` stamp, `exchangesFromMessages()`, a
      `resumeConversation`/`performResume` pair with in-flight dedupe, and the create pipeline
      extracted so resume runs the identical path. Do NOT re-implement. Remaining work: rebase onto
      current `main` (reconcile with PR #483's scope rename if it lands first), re-run checks,
      verify with tests that resume re-arms the turn-1 recall latch and demands a caller-supplied
      scope, document the resume contract in the docs page the branch touches.

      **Pinned decisions:** **STRIP the lockstep version bump from #481 during the rebase** — the
      PR carries runtime/server/cli 0.40.0 → 0.41.0, and publish fires on merge when versions
      changed; a wave-1 merge would push 0.41.0 to npm with the pre-T0-docs README (`TaskLoop`,
      the non-compiling ConsoleExporter example) — precisely what the epic exists to stop. Repo
      convention holds anyway: version bumps land in a separate release PR at the drawdown's end.
      Scope/secrets are NEVER persisted to make resume seamless — the resuming request re-supplies
      them. A pre-binding-stamp row is un-resumable with a named 4xx, never a silent empty thread.
      Root of the serialized conversations.ts track — server-5a/5b/6b land after this, server-4
      last; storage-2/3/4 also land AFTER this. Keep the PR body's correction of #480's stated
      mechanism in the merge commit.

      **Acceptance:** `bun run check` green on a branch rebased onto current main; NO package.json
      version changes in the merged diff; `POST /conversations/:id/messages` against a durable id
      succeeds and appends to the same row; a two-turn thread survives a simulated restart (fresh
      `createServer` over the same store) and turn 3 sees turns 1-2; concurrent resumes of one id
      produce one `Conversation`; pre-stamp row returns the named 4xx; PR #481 merged, #480 closed
      by it.

  - key: "500"
    key_original: server-6a
    title: "runtime: nullable tenant_id on runs/events/conversations + tenant-filtered reads"
    depends_on: []
