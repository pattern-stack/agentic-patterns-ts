  - key: "507"
    key_original: gates-6
    title: "runtime: OTel span parentage — real span trees from the injected tracer, proved by an in-memory SpanExporter"
    depends_on: ["491"]
    labels: [runtime, enhancement, testing]
    description: |
      **Size L (endorsed, do not split) · branch `gates/6-otel-span-parentage` · packages: runtime · closes T3 "OTel span parentage" — flagged highest-leverage in the epic**

      Every span in `exporters/otel.ts` is created with bare `tracer.startSpan(name)` (:84, :94,
      :113, :167, :246) — no `SpanOptions`, no `context.with(trace.setSpan(...))`, so iterations
      don't nest under `agent.run`, tool/LLM spans are orphans, and subagent runs are disconnected
      soup. The parentage is already in hand: every event carries `traceId`/`spanId`/`parentSpanId`
      (`events/types.ts:38-41`) and the exporter keeps a `spanId -> OTelSpan` map (:71) it throws away.

      **Pinned decisions:** build the tree explicitly from `event.parentSpanId` + the map — do NOT
      rely on `context.active()` (async event handlers, no ambient context). Extend the injected
      surface: optional `api: { trace, context }` alongside `tracer`; children created as
      `tracer.startSpan(name, options, api.trace.setSpan(api.context.active(), parentSpan))`; widen
      `OTelTracer.startSpan` to the 3-arg signature; absent `api` ⇒ today's flat behaviour
      unchanged. Unmapped parent (other process) ⇒ stay flat, keep `agent.parent_span_id` attribute
