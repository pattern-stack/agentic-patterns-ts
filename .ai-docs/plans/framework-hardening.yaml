  - key: "496"
    key_original: runner-1
    title: "runtime: per-call event bus in AgentRunner — stop mutating this._eventBus mid-run"
    depends_on: []
    labels: [runtime, bug]
    description: |
      **Size M · branch `hr/runner-1-per-call-event-bus` · packages: runtime · closes T1 "AgentRunner mutates its own event bus mid-call" (`agent-runner.ts:632, 1398, 1734`)**

      `run()`, `runStructured()` and `stream()` each do `if (options?.eventBus) this._eventBus =
      options.eventBus;`. With a singleton runner (NestJS default scope; `createRunner()`), two
      concurrent calls with different buses interleave — and because `emitIntent()` (:319) routes
      gate evaluation through the same bus, a gate registered for tenant A can adjudicate tenant B's
      tool calls. Live in-repo: `NodeBackedRunner.stream()` mints a fresh relay bus per run.

      **This IS a behaviour change — say so.** Today `run({eventBus: X})` rebinds the runner
      PERMANENTLY: every later `run`/`stream`/`runStructured` that omits `eventBus` keeps publishing
      to X. After this PR the bus resolves per call, so call 2 without a bus falls back to the
      constructor bus / global singleton — a consumer relying on the sticky rebind silently changes
      destination. That population is the trade we are choosing; make it visible, not silent.

      **Pinned decisions:** resolve once per public call — `const bus = options?.eventBus ??
      this._eventBus ?? getAgentEventBus();`. Implementation is the implementer's choice between
      (a) threading the bus as an explicit parameter through the shared helpers (`emit` :300,
      `emitIntent` :319, `emitCancellation` :336, `buildToolCtx` :381 incl. the Channel-B closures
      at :424/:441, `_gatewayAwareError` :482, `_maybeEmitRedaction` :565, `convertExecutableTools`
      :1266, the `createGateToolApproval` call :1490 — ~72 mechanical one-line changes) or
      (b) resolving into a small per-run context / local emit closures (~10 touch points) — same
      correctness, same acceptance either way; do NOT lock into the wide diff. Cannot be split
      per-loop since all three loops share the helpers. No `AsyncLocalStorage`, no per-call clone,
      no public TYPE change. Also fix the sibling: `coding-agent-runner.ts:349-350` mutates its
      `protected _eventBus` identically — add a `protected busFor(options)`, keep the exported
      accessor (removing it breaks out-of-repo subclasses). Keep the lazy `getAgentEventBus()`
      fallback without memoizing onto the field. Root of the serialized agent-runner.ts track —
      runner-2/4/5 and storage-6 rebase on this.

      **Acceptance:** `bun run check` green; concurrent-run isolation test (two buses, one runner,
      MockLanguageModelV3 with a slow first response) asserts each bus receives only its own run's
      events by runId; gate-isolation test asserts a bus-A gate never evaluates a bus-B tool intent;
      a test DELIBERATELY pinning the new semantics: call 1 with bus X, call 2 with no bus →
      call 2's events go to the constructor/global bus, not X; `this._eventBus` never assigned
      outside the constructor in either file; existing host-propagation and as-agent relay tests
      unchanged; CHANGELOG Unreleased → **Behaviour changes** entry naming the sticky-bus removal.

  - key: "497"
    key_original: runner-3
    title: "runtime: NodeBackedRunner.stream() honors options.runId"
