  - key: "529"
    key_original: docs-9
    title: "docs: re-release README pass — terminal Known-limitations sweep + the positioning claim"
    depends_on: ["527", "528", "524", "523", "513", "518", "519"]
    labels: [documentation, audit]
    description: |
      **Size S · branch `docs/482-rerelease-readme-pass` · packages: none (docs) · closes epic DoD #6 "every remaining gap stated plainly in the README under a Known limitations heading" — the terminal owner the plan previously lacked**

      Added on the coverage critic's finding: docs-1 creates the section and three issues append
      one line each, but nothing owned the closing pass — and several limitations THIS PLAN creates
      are recorded only in docblocks or docs pages, never in the README. This is the last issue in
      the plan by design; it depends on the terminal leaves of every track.

      **Pinned decisions:** consolidate into one honest, ordered "Known limitations" section, at
      minimum: durable execution excludes workflow/step checkpointing (storage-1 D4); runs are
      unbounded without `RunOptions.timeout` (runner-5); budget enforcement is pre-call only, ≤1
      call overshoot (storage-7); SSE replay ring is in-memory per-process — durable replay does
      not ship (server-5a); rate limiting is per-process — N replicas multiply the limit,
      `RateLimitBucketStore` is a declared, unimplemented seam (gates-3); pending-input durability
      means the RECORD survives a restart, the blocked run does not resume (server-3); layered
      entry-point subpaths are a follow-on — one barrel + Start-here table today (core-3); Postgres
      backs MemoryStore only at this point in the sequence — the `EventStore` chain port
      (storage-12..15) is planned, not shipped, and its status must be stated as of land time
      (storage-9). CORS no longer needs a limitation line — server-1 flips the default to loopback;
      DELETE this bullet if server-1 has landed, per the cross-check rule below. Add the epic's REQUIRED
      positioning sentence verbatim in spirit: *"ahead on composition, governance, and evals; young
      and unvalidated"* — not a superlative. Cross-check every line against the shipped tree (some
      may have been fixed by land time — a limitation that no longer exists gets deleted, not
      hedged). Mirror the section into `packages/agent-runtime/README.md` only if the root section
      is not linkable from npm; prefer one section + links. This is prose only — no code.

      **Acceptance:** `bun run check` green (docs-8's fence gate + link gate included); every
      listed limitation verifiably true against the tree at merge time; positioning sentence
      present; no remaining epic gap is unstated; DoD #6 checked off on epic #482.

