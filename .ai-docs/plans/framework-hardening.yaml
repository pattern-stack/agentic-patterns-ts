      `EvaluatorChain`, `ExponentialBackoff`, `collectByName`, `collectContents` — zero hits across
      `packages/*/src`. Also fold in the adjacent legacy `Sequential`/`Parallel` fences (:237-268).

      **Pinned decisions:** the classes were deleted ON PURPOSE (DESIGN.md:261) — port the EXAMPLE,
      never the class. `TaskLoop`+evaluators → `Loop` with a typed `until(output, iteration)`
      predicate (do NOT reintroduce a goal-evaluator concept). `EvaluatorLoop`/`RubricEvaluator` →
      `Loop` with `body = Sequential.start(produce).then(evaluate).build()` and structured
      `{content, score, feedback, issues[]}` state — reuse DESIGN.md §6.7's `polish` shape verbatim.
      `RetryLoop` → `Retry`/`retry()` (`workflows/retry.ts`; note in prose: never re-throws, returns
      the last failed `NodeResult`). `ConversationLoop` → `Conversation` + `ConversationStore`.
      Legacy `Sequential` → `Sequential.start(node).then(node).build()`; legacy `Parallel` →
      `new Parallel([{name, node}], {consolidate, maxConcurrency})` (`consolidatedOutput` is gone).
      Every surviving identifier must be exported from the runtime barrel — check, don't assume.
      ALSO: create the README **"Known limitations"** section (epic DoD #6) — storage-1, storage-7
      and runner-5 each add a line to it later (they now depend on this issue); docs-9 owns the
