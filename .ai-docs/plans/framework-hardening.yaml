    description: |
      **Size M · branch `srv/s6a-tenant-column` · packages: runtime · storage half of T2 "Tenancy" (item recorded on server-6b) · takes migration-ladder v6**

      No store has a tenant dimension: `RunRow` (`storage/run-store.ts:66-80`), the `events` table
      (`event-store.ts:69`) and `conversations` (:228-254) all lack it. The only tenant appearance
      is inside the unindexed free-form `runs.metadata` JSON blob. `RunStore.listRuns` has no tenant
      predicate; `GET /admin/runs` can only return everything.

      **Pinned decisions:** nullable `tenant_id TEXT` on `events`, `runs`, `conversations` as the
      next additive rung (v6) on the `PRAGMA user_version` ladder (`event-store.ts:267`, follow the
      v2-v5 precedent + an index per table). Widen `RunMeta`/`RunRow`, `PersistedEvent`,
      `StoredConversation` and the `listRuns`/`recent`/`listConversations` filters with optional
      `tenantId`. Nullable and optional — omitted ⇒ NULL column, unfiltered reads, byte-identical.
      Exact-match on a single string (no scope-subset matching — MemoryStore's machinery answers a
      different question). Nothing here derives or enforces a tenant — that is server-6b.
      Ladder serialization: this takes v6; server-3 takes v7; storage-2 takes v8 — and the ladder
      is one global integer, so a slip here slips both (header note).

      **Acceptance:** `bun run check` green; migration-ladder test in the house style (hand-build a
      v-prior DB with rows, reopen, assert survival + NULL column); `listRuns({tenantId})` filters
