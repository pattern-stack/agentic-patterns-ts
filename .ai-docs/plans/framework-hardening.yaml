  - key: "503"
    key_original: core-2
    title: "core: fix replace()/merge() on composite models and cover every AgenticModel subclass"
    depends_on: ["490"]
    labels: [core, bug, testing]
    description: |
      **Size M (budget L review) · branch `harden/core-2-composite-replace-merge` · packages: core · closes T1 "agent.replace()/role.replace() throw at runtime while typechecking clean"**

      `AgenticModel.replace` (`atoms/base.ts:63-67`) reconstructs via `new Ctor({...this._data,
      ...updates})`, but `Role` (`organisms/role.ts:76-107`) and `Agent` (`organisms/agent.ts:68-87`)
      constructors take INSTANCES and call `.data` on them — so `replace()`/`merge()` throw ZodError
      (reproduced: `role.replace({name})` → "persona expected object, received undefined").
      Second defect, same sweep: `Agency.merge()` throws its one-coordinator validation
      (`atoms/agency.ts:99-106`); `Roster` has the identical latent shape (`roster.ts:60-69`).
      Depends on core-1: both edit `atoms/base.ts`, and the drift-guard class census below must be
      taken AFTER core-1's deletion shrinks the set.

      **Pinned decisions:** follow the `Awareness.replace` precedent (`atoms/awareness.ts:185-197`)
      — override in `Role`/`Agent`, resolve `this.constructor`, rebuild from retained instance
      fields, rehydrate only keys present in `updates`. Keep the override signature base-compatible
      (`Partial<RoleData>`). Override `merge` component-wise on the composites so instances never
      round-trip through plain data; any rebuild must pass `Role.capabilities` by reference (schema
      is `z.array(z.unknown())`). Decide `Agency`/`Roster` merge explicitly — validator-aware or
      documented-and-tested throw; silent status quo is not an option.

      **Acceptance:** `bun run check` green; `role.replace`/`agent.replace`/`role.merge`/`agent.merge`
      return correct instances; table-driven suite over every concrete `AgenticModel` subclass
      remaining after core-1 (21 at last count — recount post-deletion; the drift guard makes the
      number self-maintaining) asserting constructor identity, frozen schema-valid `.data`,
      instance-carried fields surviving, source unmutated — for BOTH `replace()` and `merge()`;
      drift guard fails when a new `extends AgenticModel` class lacks a fixture; `Agency`/`Roster`
      merge asserted either way; CHANGELOG Unreleased → Bug Fixes entry.

  - key: "504"
    key_original: runner-2
    title: "runtime: forward abortSignal to every provider call — cancel must stop token burn, not just the loop"
    depends_on: ["496", "487"]
    labels: [runtime, bug]
    description: |
      **Size S · branch `hr/runner-2-abort-forwarding` · packages: runtime · closes T1 "run() never forwards abortSignal to generateText" (`agent-runner.ts:715-727`)**

      Three of five provider calls never receive `options.abortSignal`: `run()`'s `generateText`
      (:759, guarded only by the top-of-iteration check), `runStructured()`'s no-tools path (:1463),
      and its tier-2 fallback (:1633). Already correct (do not regress): the capable path (:1529)
      and `stream()`'s `streamText` (:1871).

      **Pinned decisions:** add `abortSignal: options?.abortSignal` to the three calls, then
      normalize the abort rejection: `run()` emits `agent.llm.end {finishReason: "cancelled"}`,
      skips `agent.error`, and reuses the shared cancelled return path via `cancelledAtIteration`
      (locked D1 non-throw contract); `runStructured()` rethrows as the existing
      `RunCancelledError`, never a raw AbortError. Detect via `options.abortSignal?.aborted` +
      isAbortError-style name check — no string-matching provider messages. Rewrite the
      `RunOptions.abortSignal` docstring (`runner/types.ts:171-201`), which currently documents the
      non-forwarding as deliberate. ALSO amend the runners.md §2.5 sentence docs-5 wrote ("exists
      but never forwarded") — this PR falsifies it (hence the docs-5 dependency). No new
      `RunOptions` field; no cancel-event changes to `run()`.

      **Acceptance:** `bun run check` green; a MockLanguageModelV3 that resolves only when its
      received signal fires proves the signal reaches all three call sites; aborting mid-call in
      `run()` returns `finishReason: "cancelled"` with no `agent.error`; `runStructured()` throws
      `RunCancelledError`; existing `stream()` cancellation tests (#341) unchanged; docstring +
      runners.md sentence match shipped behaviour.

  - key: "505"
    key_original: gates-2
    title: "runtime: SafetyGate argument-aware rules — predicates over tool input, not just tool names"
    depends_on: ["486"]
    labels: [runtime, enhancement]
    description: |
      **Size M · branch `gates/2-safety-arg-predicates` · packages: runtime · closes T2 "SafetyGate inspects tool names only" (`gates/safety.ts:33-45`)**

      The gate reads only `toolName`; `ToolCallIntent.arguments` (`events/types.ts:152-157`) is
