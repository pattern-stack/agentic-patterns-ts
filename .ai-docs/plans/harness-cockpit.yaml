      stops, blocked approvals denied) requires `cancel`'s onAbort hardening — hence the
      dependency; where the server exposes `POST /conversations/:id/cancel`, prefer
      cancel-route-then-ctx-cancel for an acknowledged stop (202 {run_id}), falling back
      to bare ctx-cancel on 404/older servers. Expect the deny/rejected race when
      cancelling mid-approval — render as cancelled, not server error (constraints §1.2).

