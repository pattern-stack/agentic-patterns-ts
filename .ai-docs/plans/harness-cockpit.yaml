# Harness Cockpit — revive the Go chat-patterns TUI as the terminal cockpit for the
# agentic-patterns TS server.
#
# Gate-0 provenance: strategy locked per .ai-docs/research/cli-chat-parity/gap-analysis.md
#   (rev 2) — Strategy A (revive chat-patterns against the live server contract), rounds
#   pre → R1 → R2 → R3. This plan does NOT relitigate the strategy.
# Spec of record: the six scout dossiers under .ai-docs/stacks/harness-cockpit/scout/
#   (constraints-alignment, server-n5-cancel, server-shim-displaytype, go-wire-abort,
#   go-hitl, go-scope-replay). Every file:line anchor below was verified by a scout at
#   agentic-patterns-ts main@10d5c0b and chat-patterns origin/main@187411b.
# Rollout narrative (build order, gates, risks, deferred): .ai-docs/stacks/harness-cockpit/plan.md
#
# Schema: canonical /sdlc:plan → /sdlc:sync-issues shape (exemplar: harness-runners.yaml,
#   proven by epic #317 + leaves #318-#332). Cross-repo augmentation: each issue also
#   carries explicit `repo` (agentic-patterns-ts | chat-patterns), `round` (pre|R1|R2|R3),
#   `size`, and `files` fields; sync-issues consumes key/title/depends_on/labels/description
#   — the extra fields are mirrored in each description header for the tracker.
# Tracker home (locked, OD-5): ALL issues — Go included — sync to
#   pattern-stack/agentic-patterns-ts; Go issues name their chat-patterns branch and carry
#   the `go` label. chat-patterns revival base is PINNED at 187411b (work from a fresh
#   clone of github.com/pattern-stack/chat-patterns — the sandbox clone is disposable).

plan:
  slug: harness-cockpit
  summary: "Revive chat-patterns (Go TUI) as the harness cockpit speaking the TS server's live
    HTTP/SSE contract: strategy-neutral server pre-work, R1 wire/abort/scope, R2 HITL, R3
    picker/replay + display_type + token footer, closed by a live e2e validation."
  milestone: null
  auto_approve: false
  epic_title: "Harness cockpit: chat-patterns TUI ⇄ agentic-patterns server (pre + R1-R3)"
  epic_body: |
    Revive the dormant Go chat-patterns TUI (pinned base `187411b`, BSL 1.1, builds+tests
    green under Go 1.26.1) as the terminal cockpit for the agentic-patterns server.
    Strategy locked in `.ai-docs/research/cli-chat-parity/gap-analysis.md`; evidence in
    `.ai-docs/stacks/harness-cockpit/scout/*.md`; rollout narrative in
    `.ai-docs/stacks/harness-cockpit/plan.md`.

    **Tracks.** TS server track (pre-work N5+cancel, R3 history shim + display_type,
    release tail) and Go cockpit track (R1 hygiene/wire/abort/scope/cmd, R2 HITL, R3
    footer/replay). The two tracks parallelize; Go issues land on
    github.com/pattern-stack/chat-patterns branches named in each issue.

    **Coordination / dispositions (do not re-derive):**
    - #234 and pre-work N5 share the identical 14-byte torn-stream signature but are TWO
      defects: N5 = missing catch in the drain loop (fixed here); #234 = bun/hono transport
      stall. The N5 issue verifies under node AND bun and closes #234 only if the bun repro
      passes post-fix; otherwise #234 stays open with the transport half.
    - COLLISION: `packages/agent-server/src/routes/conversations.ts` is edited by pre-work
      (n5, cancel), the R3 shim, #296 (SSE fan-out consolidation) and #328 (harness-runners
      B3). Protocol: pre-work lands first; the shim PR states its ordering vs whatever of
      #296/#328 has landed; the cancel route joins the same protocol.
    - harness-runners is a LIVE open arc (#317-#332), not a draft. The cockpit builds R2 on
      TODAY'S input transport and declares the forward-compat seam vs #328/B3 (requestId
      alias + availableDecisions-driven rendering); R1/R3 need only lenient-decode rules.
      See plan.md "Forward compatibility".
    - #287 (SendMessageBody doc drift): the Go client is fixed to send `content` — no
      server-side `message` alias is added; #287 stays a pure docs fix.
    - #306 (chat organism package-ization) and #304 (ChatPage split): NO overlap — the
      cockpit consumes the HTTP/SSE contract, not the React chat organism, and is not
      #306's "second consumer".
    - #300 naming: an older doc uses "cockpit-port" for a shipped dashboard effort. This
      arc is "harness cockpit" — distinct; #300 cleanup must not sweep
      `.ai-docs/stacks/harness-cockpit/`.

    **Human gates:** A after pre-work (N5 under node+bun, cancel demo) · B after R1
    first-light (cockpit full turn vs live `ap playground`) · C after R2 HITL e2e
    (approve/deny/timeout with a real key) · D final walkthrough + publish.
