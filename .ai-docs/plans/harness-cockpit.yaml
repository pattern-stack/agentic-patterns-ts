      surfaced as a system line + `/scope` display-only command (scope is immutable
      server-side). `Config.DefaultScope` bypasses the phase (consumer cmd owns
      `--context`/`AP_CONTEXT` parsing later). Non-HTTP transports error LOUDLY on
      non-empty scope (S-2). Schema-driven forms deferred (S-3) — decode
      `instantiation.schema`, render nothing. Clear the latent never-reset `loadErr`.

      **Acceptance:**
      - httpclient tests: instantiation decode (presets/defaults/null schema/absent→nil);
        nil scope → no `scope` key on the wire; map → carried; 400-with-issues → typed
        error; other 400/404 surface the server `error` string; 201 echo lands in result.
