  - key: "341"
    title: "runtime+server: cancellation — RunOptions.abortSignal + POST /conversations/:id/cancel +
      disconnect hardening"
    repo: agentic-patterns-ts
    round: pre
    size: M
    depends_on:
      - "340"
    labels:
      - cockpit
      - server
      - runtime
    files:
      - packages/agent-runtime/src/runner/types.ts:112-141 (RunOptions.abortSignal)
      - packages/agent-runtime/src/runner/agent-runner.ts:1208-1213,1237-1349,1177,1450 (streamText
        signal, abort part, guards)
      - packages/agent-runtime/src/conversation/conversation.ts:211-267 (signal passthrough, honest
        end reason)
      - packages/agent-server/src/routes/conversations.ts:35-50,331-445,454+
        (ConversationEntry.activeTurn, onAbort, cancel route)
      - packages/agent-server/src/__tests__/conversations-cancel.test.ts (new)
      - packages/agent-runtime/src/runner/__tests__/agent-runner-stream.test.ts (extend)
    description: |
      **Size M · branch `cockpit/cancel` · repo agentic-patterns-ts · round pre ·
      packages: runtime, server · spec: scout/server-n5-cancel.md Part B (stacks on n5)**

      Both halves in one PR (Option 2 as the contract, Option 1 as the safety net):
      (1) `RunOptions.abortSignal` → `streamText({abortSignal})`, `case "abort"` in the
      fullStream switch, top-of-iteration + pre-tool-dispatch guards, AbortError
      belt-and-braces; the RUNNER emits `agent.message.cancel` + `agent.conversation.end
      {reason:"cancelled"}` and returns — never throws (D1). (2) `Conversation.stream`
      accepts `signal`, stamps its trailing end reason honestly. (3) Server:
      `ConversationEntry.activeTurn {controller, runId?, startedAt}`; messages route wires
      the signal, mirrors runId, registers `stream.onAbort(onCancel)` where onCancel aborts
      + deny-sweeps pending inputs (fixes the blocked-approval disconnect hang), 409 guard
      on concurrent sends (D2). (4) New `POST /conversations/:id/cancel`: 404 unknown /
      409 idle / 202 `{ok, run_id?}` (D3); idempotent while winding down. Wire contract for
      a cancelled turn: `…delta* → message.cancel → conversation.end{cancelled} ×2 → done`.
      CLI adoption of the signal is deferred (D6). Route auto-appears in /openapi.json.

      COLLISION: conversations.ts protocol (see epic) — this is why it stacks on n5.

      **Acceptance:**
      - Runtime: pre-aborted signal → cancel pair, no llm.start, generator returns; abort
        between iterations → no second llm.start; abort mid-provider-stream (MockLanguageModelV2
        never-closing stream) → cancel pair; Conversation end reason "cancelled" + partial
        exchange recorded.
      - Server: cancel grammar 404/409/202; cancelled turn's SSE body ends
        `message.cancel … done`; deny-sweep-on-cancel unparks a registry-blocked run;
        disconnect (reader .cancel()) aborts the runner double and denies pending input;
        concurrent second POST …/messages → 409.
      - Manual: React Stop now actually stops the runner (token burn ends); curl cancel
        returns 202 and the open stream winds down.
      - `bun run check` green; bump rides `rel1`.
    key_original: cancel
