      **Size L (mini-plan = scout/go-scope-replay.md §1, adjudicated ODs S-1..S-4) ·
      branch `cockpit/scope` · repo chat-patterns · round R1**

      Decode `instantiation {available, defaults, schema, presets}` from GET /agents;
