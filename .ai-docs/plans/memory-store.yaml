  slug: memory-store
  summary: "ADR-0007 Phase 1: MemoryRecord core molecules, MemoryStore protocol + InMemory + SQLite/FTS5 backends with an exported conformance kit, memory events, MemoryToolbox, and the budget-capped turn-1 recall surface."
  milestone: null
  auto_approve: true             # gate1: auto — trust grant given in-session; Gate 2 (PR review) stays human
  existing_epic: "415"           # leaves roll up under the existing memory epic — do not create a new epic
