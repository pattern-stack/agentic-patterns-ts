# Harness Runners — subscription-powered standard agents (Track A)
#   + interchangeable coding-agent harnesses w/ cross-harness permission bridge (Track B)
# Gate 0: design v4 approved-in-session (2026-07-19); plan rev 2 approved 2026-07-19 ("Aligned - please sync").
# Plan rev 2 folded the 3-lens reviewer panel (adherence PASS_WITH_NOTES / logic REVISE / scope REVISE).
# Spec of record: .ai-docs/stacks/harness-runners/design.md (v4; section refs below).
# Review trail: review-codex-sol*.md (design rounds 1-3) + in-session plan panel.

plan:
  slug: harness-runners
  summary: "Subscription-powered standard agents (claudeCode provider promotion) + interchangeable coding-agent harnesses (CodingAgentRunner base, CC + Codex adapters) with a cross-harness human-permission bridge."
  milestone: null                # no milestone discipline in this repo; epic + sub-issues carry the rollup
  auto_approve: false            # gate1: strict — every leaf gets gate:human
  epic_title: "Harness Runners: subscription-powered agents + interchangeable coding-agent harnesses"
  epic_body: |
    Two tracks, one foundation. **Spec of record:** `.ai-docs/stacks/harness-runners/design.md` (v4,
    iterated through 3 adversarial Codex review rounds; reviews alongside the design).
    Plan: `.ai-docs/plans/harness-runners.yaml` (rev 2, 3-lens reviewer panel folded).

    **Track A** — users power standard framework agents with their Claude Max subscription as if it
    were an API key: `claudeCode()` LMv2 provider gains the cc-config isolation/OAuth seams
    (fail-closed), session economics stop spawning a subprocess per tool-loop iteration, and
    `createRunner()` gains a probe-backed subscription rung.

    **Track B** — CodingAgents for SDLC phases where the harness owns the loop: extract a
    `CodingAgentRunner` base + bidirectional `HarnessAdapter`/`HarnessSession`, refactor
    `ClaudeCodeRunner` onto it, build the cross-harness permission bridge (AskContext through
    gates → transport → dashboard approval UI → native reply), then validate the abstraction with a
    Codex App Server adapter.

    **Foundations:** SDK ^0.3.x bump (F1), public gate-evaluation API w/ guaranteed audit (F2,
    fixes #288), `deferred_tool_use` spike (F3), Codex contract-test spike (R1).

    **Waves:** 1: F1+F2+F3+R1 (merge barrier; F3/R1 findings get a human read) → 2: A1→B1 →
    3: A2+B2+E1 → 4: A3+B3 → 5: B4+U1 → 6: DOC1→REL1.

    **Issue coordination:** E1 subsumes #286; F2 implements #289's invariant (spec states
    disposition); B3 must declare subsume-or-sequence vs #296/#234; B2 states #302 disposition.
    Durable-decision feature flag stays OFF until #307 (design D13).

