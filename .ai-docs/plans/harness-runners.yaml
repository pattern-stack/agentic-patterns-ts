# --- Auxiliary plan metadata (not consumed by /sync-issues; source of truth for execution) ---

execution_policy:
  - >-
    Wave N merges to main before wave N+1 branches (barrier — depends_on alone is not
    sufficient: claude-code-runner.ts is edited by F2, A1, B1 and rewritten by B2).
  - >-
    claude-code-runner.ts is a SHARED SURFACE; its editors serialize F2 → A1 → B1 → B2.
  - >-
    F1 and F2 are file-disjoint (verified) — parallel is safe; only coupling is typecheck
    integration where the SDK bump touches runner types both edit.

waves:
  - id: wave1              # foundations + spikes — parallel worktrees off main; MERGE BARRIER after
    slices: [f1, f2, f3, r1]
    human_gate: F3 and R1 findings get a human read before wave3 starts
  - id: wave2              # a1 then b1 (serialized — shared runner file); both need wave1 merged
    slices: [a1, b1]
  - id: wave3
    slices: [a2, b2, e1]
  - id: wave4
    slices: [a3, b3]
  - id: wave5              # parallel: b4 needs b3 (seam); u1 needs b3+e1 (UI)
    slices: [b4, u1]
  - id: wave6              # ship tail
    slices: [doc1, rel1]

locked_decisions:          # curated subset of design §6 — the load-bearing ones implementers must not relitigate
  - D1 two seams — LMv2 iff framework owns the loop; RunnerProtocol iff the harness does. No LMv2 coding agents.
  - D3 R-1 contract facts land BEFORE base extraction (B2); base stays provisional until B4.
  - D4 decision contract — allowSession (native cache, Codex-only) ≠ allowWithRules (≥1 proposal refs); 4-step validation kind/compat/scope/authz.
  - D5 AskContext threads adapter→gates→transport→audit; audit phase guaranteed via recordDecision(evaluation, ctx).
  - D9 policy hedge — every auth path keeps an explicit token/API-key swap seam (both vendors); a subscription-policy reversal must be a config change.
  - D11 isolation fails closed — unresolvable auth in isolated mode is an error, never host fall-through.
  - D13 durability split — durable decisions feature-flagged OFF until #307 provides actor identity.
  - Reproducibility = lockfile + committed schema fixtures (stable channel) asserted in CI; manifest range is intake policy, not the pin.
  - Codex integration surface is App Server (bidirectional JSON-RPC/JSONL); `codex exec --json` is telemetry-only; no `proto`.
  - The Agent SDK bundles its CC executable (platform packages, lockfile-pinned); probes test SDK launch/auth readiness, not PATH.
